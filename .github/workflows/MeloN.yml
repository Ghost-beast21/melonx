name: Melonx_release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build latest MeloNX
    runs-on: macos-26

    steps:
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht
          path: helper

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clone latest MeloNX
        run: |
          git clone \
            --recurse-submodules \
            --branch master \
            https://starforgejo.dev/projects/MeloNX.git \
            source

      - name: Pull Git LFS files
        run: |
          cd source
          git lfs install
          git lfs pull
          git submodule update --init --recursive

      - name: Show MeloNX version
        run: |
          cd source
          git log -1 --oneline

      - name: Setup dotnet path
        run: |
          sudo mkdir -p /usr/local/share/dotnet
          DOTNET_PATH="$(which dotnet)"
          sudo ln -sf "$DOTNET_PATH" /usr/local/share/dotnet/dotnet
          dotnet --info

      - name: Download LibHac backup
        run: |
          mkdir -p source/local-nuget

          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            -A "GitHub-Actions-MeloNX" \
            "https://github.com/NextendoNetwork/Ryujinx-Nextendo/releases/download/build-deps/ryujinx.libhac.0.21.0-alpha.133.nupkg" \
            -o "source/local-nuget/ryujinx.libhac.0.21.0-alpha.133.nupkg"

          ls -lh source/local-nuget

      - name: Use LibHac backup version
        run: |
          cd source

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("Directory.Packages.props")
          text = path.read_text()

          text = re.sub(
              r'<PackageVersion Include="Ryujinx\.LibHac" Version="[^"]+" />',
              '<PackageVersion Include="Ryujinx.LibHac" Version="0.21.0-alpha.133" />',
              text
          )

          path.write_text(text)
          PY

          grep "Ryujinx.LibHac" Directory.Packages.props

      - name: Configure NuGet
        run: |
          cat > source/nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>

            <packageSources>
              <clear />
              <add key="LocalLibHac" value="./local-nuget" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>

            <packageSourceMapping>

              <packageSource key="LocalLibHac">
                <package pattern="Ryujinx.LibHac" />
              </packageSource>

              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>

            </packageSourceMapping>

          </configuration>
          EOF

          cat source/nuget.config

      - name: Restore Ryujinx Library
        run: |
          cd source

          dotnet restore \
            src/Ryujinx.Library/Ryujinx.Library.csproj \
            --configfile nuget.config

      - name: Build Ryujinx Library
        run: |
          cd source

          chmod +x distribution/ios/build.sh

          ./distribution/ios/build.sh

      - name: Verify Ryujinx build
        run: |
          cd source

          echo "Searching for Ryujinx.Library.dylib"

          find \
            src/Ryujinx.Library \
            -type f \
            -name '*.dylib' \
            -print

          DYLIB="$(find \
            src/Ryujinx.Library \
            -type f \
            -name 'Ryujinx.Library.dylib' \
            -print \
            -quit)"

          if [ -z "$DYLIB" ]; then
            echo "ERROR: Ryujinx.Library.dylib was not created."
            exit 1
          fi

          echo "Found:"
          echo "$DYLIB"

          file "$DYLIB"

      - name: Prevent Xcode rebuilding Ryujinx
        run: |
          cat > source/distribution/ios/build.sh <<'EOF'
          #!/usr/bin/env bash
          echo "Ryujinx.Library already built by GitHub Actions."
          exit 0
          EOF

          chmod +x source/distribution/ios/build.sh

      - name: Install xcodeproj
        run: |
          gem install xcodeproj

      - name: Copy build helper
        run: |
          cp \
            helper/embed_sign_dylib.rb \
            source/embed_sign_dylib.rb

      - name: Configure project
        run: |
          cd source
          ruby embed_sign_dylib.rb

      - name: Verify dynamic libraries
        run: |
          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libavcodec.dylib"

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libavutil.dylib"

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libMoltenVK.dylib"

      - name: Resolve Swift packages
        run: |
          cd source/src/MeloNX

          xcodebuild \
            -resolvePackageDependencies \
            -project "MeloNX.xcodeproj" \
            -scheme "MeloNX"

      - name: Build MeloNX archive
        run: |
          cd source/src/MeloNX

          set -o pipefail

          xcodebuild archive \
            -project "MeloNX.xcodeproj" \
            -scheme "MeloNX" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../../MeloNX_archive" \
            -jobs 1 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Verify archive
        run: |
          test -d \
            "source/MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

          echo "MeloNX archive created successfully"

          ls -lah \
            "source/MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

      - name: Compress archive
        run: |
          tar \
            -cvf MeloNX_archive.xcarchive.tar \
            -C source \
            MeloNX_archive.xcarchive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX_archive.xcarchive.tar
          path: MeloNX_archive.xcarchive.tar

  package:
    name: Create MeloNX IPA
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht

      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: MeloNX_archive.xcarchive.tar

      - name: Extract archive
        run: |
          tar -xf MeloNX_archive.xcarchive.tar

      - name: Install ldid
        run: |
          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            -o /usr/local/bin/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_$(uname -m)"

          chmod +x /usr/local/bin/ldid

      - name: Verify MeloNX app
        run: |
          test -d \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

      - name: Fake sign frameworks
        run: |
          find \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            -type d \
            -path '*/Frameworks/*.framework' \
            -exec ldid -SMeloNX-hv.entitlements {} \;

      - name: Fake sign dylibs
        run: |
          find \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            -type f \
            -name '*.dylib' \
            -exec ldid -SMeloNX-hv.entitlements {} \;

      - name: Fake sign MeloNX
        run: |
          ldid \
            -SMeloNX-hv.entitlements \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app/MeloNX"

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            Payload/MeloNX.app

          zip \
            -r \
            MeloNX.ipa \
            Payload \
            -x "._*" \
            -x ".DS_Store" \
            -x "__MACOSX/*"

      - name: Verify IPA
        run: |
          ls -lh MeloNX.ipa

      - name: Upload MeloNX IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX_latest.ipa
          path: MeloNX.ipa
