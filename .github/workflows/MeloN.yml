name: Melonx_release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build latest MeloNX
    runs-on: macos-26

    steps:
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht
          path: helper

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Clone latest MeloNX
        run: |
          git clone \
            --recurse-submodules \
            --branch master \
            https://starforgejo.dev/projects/MeloNX.git \
            source

      - name: Pull Git LFS files
        run: |
          cd source
          git lfs install
          git lfs pull
          git submodule update --init --recursive

      - name: Show MeloNX commit
        run: |
          cd source
          echo "Latest MeloNX commit:"
          git log -1 --oneline

      - name: Setup dotnet path
        run: |
          sudo mkdir -p /usr/local/share/dotnet

          DOTNET_PATH="$(which dotnet)"

          sudo ln -sf \
            "$DOTNET_PATH" \
            /usr/local/share/dotnet/dotnet

          dotnet --info

      - name: Download LibHac backup package
        run: |
          mkdir -p source/local-nuget

          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            -A "GitHub-Actions-MeloNX-Build" \
            "https://github.com/NextendoNetwork/Ryujinx-Nextendo/releases/download/build-deps/ryujinx.libhac.0.21.0-alpha.133.nupkg" \
            -o "source/local-nuget/ryujinx.libhac.0.21.0-alpha.133.nupkg"

          echo "Downloaded package:"
          ls -lh source/local-nuget/

          echo "Checking SHA256..."

          ACTUAL_HASH="$(shasum -a 256 \
            source/local-nuget/ryujinx.libhac.0.21.0-alpha.133.nupkg \
            | awk '{print $1}')"

          EXPECTED_HASH="554bf2315368f193335c0ac60d73d73fb8c318aaf3f8a13bddf4ef30e160b631"

          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "ERROR: LibHac package checksum does not match."
            exit 1
          fi

          echo "LibHac package verified successfully."

      - name: Replace broken NuGet source
        run: |
          cat > source/nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>

            <packageSources>
              <clear />

              <add
                key="LocalLibHac"
                value="./local-nuget" />

              <add
                key="nuget.org"
                value="https://api.nuget.org/v3/index.json" />

            </packageSources>

            <packageSourceMapping>

              <packageSource key="LocalLibHac">
                <package pattern="Ryujinx.LibHac" />
              </packageSource>

              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>

            </packageSourceMapping>

          </configuration>
          EOF

          echo "New nuget.config:"
          cat source/nuget.config

      - name: Restore Ryujinx iOS project
        run: |
          cd source

          dotnet restore \
            src/Ryujinx.Headless.SDL2/Ryujinx.Headless.SDL2.csproj \
            --configfile nuget.config

      - name: Build Ryujinx manually
        run: |
          cd source

          chmod +x distribution/ios/get_dotnet.sh
          chmod +x distribution/ios/xc-compile.sh

          ./distribution/ios/xc-compile.sh

          echo "Searching for Ryujinx dylib..."

          DYLIB="$(find \
            src \
            -type f \
            -name 'Ryujinx.Headless.SDL2.dylib' \
            -print \
            -quit)"

          if [ -z "$DYLIB" ]; then
            echo "Ryujinx.Headless.SDL2.dylib was not created."
            echo "Available dylibs:"
            find src -type f -name '*.dylib' -print || true
            exit 1
          fi

          echo "Found:"
          echo "$DYLIB"

          mkdir -p \
            "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries"

          cp \
            "$DYLIB" \
            "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"

          file \
            "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"

      - name: Install xcodeproj
        run: |
          gem install xcodeproj

      - name: Disable Xcode Ryujinx build target
        run: |
          cd source

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'src/MeloNX/MeloNX.xcodeproj'

          project = Xcodeproj::Project.open(project_path)

          melonx = project.targets.find do |target|
            target.name == 'MeloNX'
          end

          abort('MeloNX target not found') unless melonx

          melonx.dependencies.dup.each do |dependency|

            target = dependency.target

            next unless target

            if target.name.downcase.include?('ryujinx')

              puts "Removing dependency: #{target.name}"

              melonx.dependencies.delete(dependency)

              begin
                dependency.remove_from_project
              rescue
              end

            end
          end

          project.root_object.attributes[
            'BuildIndependentTargetsInParallel'
          ] = 'NO'

          project.save

          puts 'Ryujinx Xcode dependency disabled.'
          RUBY

      - name: Copy build helper
        run: |
          cp \
            helper/embed_sign_dylib.rb \
            source/embed_sign_dylib.rb

      - name: Configure dynamic libraries
        run: |
          cd source

          ruby embed_sign_dylib.rb

      - name: Verify dynamic libraries
        run: |
          echo "Checking dynamic libraries..."

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libavcodec.dylib"

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libavutil.dylib"

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libMoltenVK.dylib"

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"

      - name: Resolve Swift packages
        run: |
          cd source/src/MeloNX/

          xcodebuild \
            -resolvePackageDependencies \
            -project "MeloNX.xcodeproj" \
            -scheme "MeloNX"

      - name: Build MeloNX archive
        run: |
          cd source/src/MeloNX/

          export PATH="$HOME/.dotnet:$PATH"

          set -o pipefail

          xcodebuild archive \
            -project "MeloNX.xcodeproj" \
            -scheme "MeloNX" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../../MeloNX_archive" \
            -jobs 1 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Verify archive
        run: |
          test -d \
            "source/MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

          echo "MeloNX archive successfully created."

          ls -lah \
            "source/MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

      - name: Compress archive
        run: |
          tar \
            -cvf "MeloNX_archive.xcarchive.tar" \
            -C source \
            "MeloNX_archive.xcarchive"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX_archive.xcarchive.tar
          path: MeloNX_archive.xcarchive.tar

  package:
    name: Create MeloNX IPA
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht

      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: MeloNX_archive.xcarchive.tar

      - name: Extract archive
        run: |
          tar -xf "MeloNX_archive.xcarchive.tar"

      - name: Install ldid
        run: |
          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            -o /usr/local/bin/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_$(uname -m)"

          chmod +x /usr/local/bin/ldid

      - name: Verify MeloNX app
        run: |
          test -d \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

          echo "MeloNX.app found."

      - name: Fake sign frameworks
        run: |
          find \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            -type d \
            -path '*/Frameworks/*.framework' \
            -exec ldid -SMeloNX-hv.entitlements {} \;

      - name: Fake sign dylibs
        run: |
          find \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            -type f \
            -name '*.dylib' \
            -exec ldid -SMeloNX-hv.entitlements {} \;

      - name: Fake sign MeloNX
        run: |
          ldid \
            -SMeloNX-hv.entitlements \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app/MeloNX"

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            "Payload/MeloNX.app"

          zip \
            -r \
            "MeloNX.ipa" \
            "Payload" \
            -x "._*" \
            -x ".DS_Store" \
            -x "__MACOSX/*"

      - name: Verify IPA
        run: |
          ls -lh MeloNX.ipa

          unzip -l MeloNX.ipa | head -50

      - name: Upload MeloNX IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX_latest.ipa
          path: MeloNX.ipa
