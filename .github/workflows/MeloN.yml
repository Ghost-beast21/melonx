name: Melonx_release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build latest MeloNX
    runs-on: macos-26

    steps:
      # Conservamos nuestros archivos auxiliares del fork que ya
      # sabemos que funcionaron en la compilación anterior.
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht
          path: helper

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # MeloNX master actual ya utiliza .NET 10.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Clone latest MeloNX from Starforge
        run: |
          git clone \
            --recurse-submodules \
            --branch master \
            https://starforgejo.dev/projects/MeloNX.git \
            source

      - name: Pull Git LFS files
        run: |
          cd source
          git lfs install
          git lfs pull
          git submodule update --init --recursive

      - name: Show downloaded MeloNX version
        run: |
          cd source
          echo "Latest MeloNX commit:"
          git log -1 --oneline
          echo ""
          echo "Repository status:"
          git status

      - name: Copy build helper
        run: |
          cp helper/embed_sign_dylib.rb source/embed_sign_dylib.rb

      - name: Verify dynamic libraries
        run: |
          file "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libavcodec.dylib"
          file "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libavutil.dylib"
          file "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libMoltenVK.dylib"

      - name: Setup dotnet symlink
        run: |
          sudo mkdir -p /usr/local/share/dotnet

          DOTNET_PATH="$(which dotnet)"

          sudo ln -sf \
            "$DOTNET_PATH" \
            /usr/local/share/dotnet/dotnet

          dotnet --info

      # Esta primera compilación puede fallar.
      # Es intencional: es el mismo método que usamos
      # cuando conseguimos compilar tu IPA anterior.
      - name: First archive attempt
        continue-on-error: true
        run: |
          cd source/src/MeloNX/

          set -o pipefail

          xcodebuild archive \
            -archivePath "../../MeloNX_archive" \
            -scheme "MeloNX.app" \
            -target "MeloNX" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Configure project through Ruby script
        run: |
          cd source

          gem install xcodeproj

          ruby embed_sign_dylib.rb

      - name: Build MeloNX archive
        run: |
          cd source/src/MeloNX/

          set -o pipefail

          xcodebuild archive \
            -archivePath "../../MeloNX_archive" \
            -scheme "MeloNX" \
            -target "MeloNX" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Verify archive
        run: |
          test -d "source/MeloNX_archive.xcarchive"
          test -d "source/MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

          echo "MeloNX archive successfully created"

          ls -lah \
            "source/MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

      - name: Compress build artifact
        run: |
          tar \
            -cvf "MeloNX_archive.xcarchive.tar" \
            -C source \
            "MeloNX_archive.xcarchive"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX_archive.xcarchive.tar
          path: MeloNX_archive.xcarchive.tar


  package:
    name: Create MeloNX IPA
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Aquí necesitamos nuestro archivo de entitlements.
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MeloNX_archive.xcarchive.tar

      - name: Extract build artifact
        run: |
          tar -xf "MeloNX_archive.xcarchive.tar"

      - name: Install ldid
        run: |
          curl -sSL \
            -o /usr/local/bin/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_$(uname -m)"

          chmod +x /usr/local/bin/ldid

          ldid -h || true

      - name: Verify MeloNX app
        run: |
          test -d \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

          echo "MeloNX.app found"

      - name: Fake sign frameworks
        run: |
          find \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            -type d \
            -path '*/Frameworks/*.framework' \
            -exec ldid -SMeloNX-hv.entitlements {} \;

      - name: Fake sign dynamic libraries
        run: |
          find \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            -type f \
            -name '*.dylib' \
            -exec ldid -SMeloNX-hv.entitlements {} \;

      - name: Fake sign MeloNX
        run: |
          ldid \
            -SMeloNX-hv.entitlements \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app/MeloNX"

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            "Payload/MeloNX.app"

          zip -r \
            "MeloNX.ipa" \
            "Payload" \
            -x "._*" \
            -x ".DS_Store" \
            -x "__MACOSX/*"

      - name: Verify IPA
        run: |
          ls -lh MeloNX.ipa

          unzip -l MeloNX.ipa | head -50

      - name: Upload MeloNX IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX_latest.ipa
          path: MeloNX.ipa
