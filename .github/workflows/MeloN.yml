name: Melonx_release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build latest MeloNX
    runs-on: macos-26

    steps:
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht
          path: helper

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clone latest MeloNX
        run: |
          git clone \
            --recurse-submodules \
            --branch master \
            https://starforgejo.dev/projects/MeloNX.git \
            source

      - name: Pull Git LFS files
        run: |
          cd source
          git lfs install
          git lfs pull
          git submodule update --init --recursive

      - name: Show MeloNX version
        run: |
          cd source
          echo "Latest MeloNX commit:"
          git log -1 --oneline

      - name: Patch EmulationView initializer
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "source/src/MeloNX/MeloNX/UI/Emulation/EmulationView.swift"
          )

          if not path.exists():
              print("ERROR: EmulationView.swift does not exist.")
              raise SystemExit(1)

          text = path.read_text()

          if "init(game: GameInfo)" in text:
              print("init(game: GameInfo) already exists. No patch required.")
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)

          insert_at = None
          indent = "    "

          for i, line in enumerate(lines):
              if line.strip() == "@ViewBuilder":
                  insert_at = i
                  indent = line[:len(line) - len(line.lstrip())]
                  break

          if insert_at is None:
              print("ERROR: Could not find @ViewBuilder insertion point.")

              for i, line in enumerate(lines, 1):
                  if (
                      "isConnected" in line
                      or "@ViewBuilder" in line
                      or "var game" in line
                  ):
                      print(f"{i}: {line.rstrip()}")

              raise SystemExit(1)

          initializer = [
              f"{indent}init(game: GameInfo) {{\n",
              f"{indent}    self.game = game\n",
              f"{indent}}}\n",
              "\n"
          ]

          lines[insert_at:insert_at] = initializer

          path.write_text("".join(lines))

          print(
              "SUCCESS: Explicit EmulationView(game:) "
              "initializer inserted."
          )
          PY

          echo ""
          echo "Patched EmulationView section:"

          grep -A 8 -B 8 \
            "init(game: GameInfo)" \
            source/src/MeloNX/MeloNX/UI/Emulation/EmulationView.swift

      - name: Setup dotnet path
        run: |
          sudo mkdir -p /usr/local/share/dotnet

          DOTNET_PATH="$(which dotnet)"

          sudo ln -sf \
            "$DOTNET_PATH" \
            /usr/local/share/dotnet/dotnet

          dotnet --info

      - name: Download LibHac backup
        run: |
          mkdir -p source/local-nuget

          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            -A "GitHub-Actions-MeloNX" \
            "https://github.com/NextendoNetwork/Ryujinx-Nextendo/releases/download/build-deps/ryujinx.libhac.0.21.0-alpha.133.nupkg" \
            -o "source/local-nuget/ryujinx.libhac.0.21.0-alpha.133.nupkg"

          echo "Downloaded LibHac:"
          ls -lh source/local-nuget

      - name: Use LibHac backup version
        run: |
          cd source

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("Directory.Packages.props")

          if not path.exists():
              print("ERROR: Directory.Packages.props not found.")
              raise SystemExit(1)

          text = path.read_text()

          new_text = re.sub(
              r'<PackageVersion Include="Ryujinx\.LibHac" Version="[^"]+" />',
              '<PackageVersion Include="Ryujinx.LibHac" Version="0.21.0-alpha.133" />',
              text
          )

          path.write_text(new_text)

          print("Ryujinx.LibHac configured.")
          PY

          grep \
            "Ryujinx.LibHac" \
            Directory.Packages.props \
            || true

      - name: Configure NuGet
        run: |
          cat > source/nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>

            <packageSources>
              <clear />

              <add
                key="LocalLibHac"
                value="./local-nuget" />

              <add
                key="nuget.org"
                value="https://api.nuget.org/v3/index.json" />

            </packageSources>

            <packageSourceMapping>

              <packageSource key="LocalLibHac">
                <package pattern="Ryujinx.LibHac" />
              </packageSource>

              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>

            </packageSourceMapping>

          </configuration>
          EOF

          echo "nuget.config:"
          cat source/nuget.config

      - name: Restore Ryujinx Library
        run: |
          cd source

          dotnet restore \
            src/Ryujinx.Library/Ryujinx.Library.csproj \
            --configfile nuget.config

      - name: Build Ryujinx Library
        run: |
          cd source

          chmod +x distribution/ios/build.sh

          ./distribution/ios/build.sh

      - name: Verify Ryujinx build
        run: |
          cd source

          echo "Searching for Ryujinx dylibs..."

          find \
            src/Ryujinx.Library \
            -type f \
            -name '*.dylib' \
            -print \
            || true

          DYLIB="$(find \
            src/Ryujinx.Library \
            -type f \
            -name 'Ryujinx.Library.dylib' \
            -print \
            -quit)"

          if [ -z "$DYLIB" ]; then
            echo "ERROR: Ryujinx.Library.dylib was not created."
            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$DYLIB"

          file "$DYLIB"

      - name: Prevent Xcode rebuilding Ryujinx
        run: |
          cat > source/distribution/ios/build.sh <<'EOF'
          #!/usr/bin/env bash
          echo "Ryujinx.Library already built by GitHub Actions."
          exit 0
          EOF

          chmod +x source/distribution/ios/build.sh

      - name: Install xcodeproj
        run: |
          gem install xcodeproj

      - name: Copy build helper
        run: |
          cp \
            helper/embed_sign_dylib.rb \
            source/embed_sign_dylib.rb

      - name: Configure project
        run: |
          cd source

          ruby embed_sign_dylib.rb

      - name: Verify dynamic libraries
        run: |
          echo "Checking dynamic libraries..."

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libavcodec.dylib"

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libavutil.dylib"

          file \
            "source/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libMoltenVK.dylib"

      - name: Resolve Swift packages
        run: |
          cd source/src/MeloNX

          xcodebuild \
            -resolvePackageDependencies \
            -project "MeloNX.xcodeproj" \
            -scheme "MeloNX"

      - name: Build MeloNX archive
        run: |
          cd source/src/MeloNX

          echo "========================================="
          echo "Starting MeloNX Xcode archive"
          echo "========================================="

          set +e
          set -o pipefail

          xcodebuild archive \
            -project "MeloNX.xcodeproj" \
            -scheme "MeloNX" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../../MeloNX_archive" \
            -jobs 1 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/melonx-xcodebuild.log

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "========================================="
          echo "Xcode exit status: $BUILD_STATUS"
          echo "========================================="

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "REAL XCODE ERRORS"
            echo "========================================="

            grep -nEi \
              'error:|fatal error:|undefined symbol|duplicate symbol|cannot find|cannot convert|cannot assign|inaccessible|no member|ambiguous|missing argument|extra argument|failed to build|emit-module command failed' \
              /tmp/melonx-xcodebuild.log \
              | tail -200 \
              || true

            echo ""
            echo "========================================="
            echo "SWIFT ERROR CONTEXT"
            echo "========================================="

            python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("/tmp/melonx-xcodebuild.log")

          if not path.exists():
              print("Xcode log was not found.")
              raise SystemExit(0)

          lines = path.read_text(
              errors="replace"
          ).splitlines()

          pattern = re.compile(
              r'error:|fatal error:|'
              r'undefined symbol|'
              r'duplicate symbol|'
              r'inaccessible|'
              r'cannot find|'
              r'cannot convert|'
              r'cannot assign|'
              r'no member|'
              r'ambiguous|'
              r'missing argument|'
              r'extra argument',
              re.IGNORECASE
          )

          matches = []

          for i, line in enumerate(lines):
              if pattern.search(line):
                  matches.append(i)

          if not matches:
              print("No explicit compiler error line was detected.")
          else:
              shown = set()

              for index in matches[-20:]:
                  start = max(0, index - 5)
                  end = min(len(lines), index + 7)

                  for n in range(start, end):
                      if n not in shown:
                          print(
                              f"{n + 1}: "
                              f"{lines[n]}"
                          )
                          shown.add(n)

                  print(
                      "-----------------------------------------"
                  )
          PY

            echo ""
            echo "========================================="
            echo "LAST 250 LINES OF XCODE LOG"
            echo "========================================="

            tail -250 \
              /tmp/melonx-xcodebuild.log \
              || true

            echo ""
            echo "========================================="
            echo "END OF XCODE ERRORS"
            echo "========================================="

            exit "$BUILD_STATUS"
          fi

          echo ""
          echo "========================================="
          echo "Archive finished successfully."
          echo "========================================="

      - name: Verify archive
        run: |
          test -d \
            "source/MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

          echo "MeloNX archive created successfully."

          ls -lah \
            "source/MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

      - name: Compress archive
        run: |
          tar \
            -cvf MeloNX_archive.xcarchive.tar \
            -C source \
            MeloNX_archive.xcarchive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX_archive.xcarchive.tar
          path: MeloNX_archive.xcarchive.tar

  package:
    name: Create MeloNX IPA
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht

      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: MeloNX_archive.xcarchive.tar

      - name: Extract archive
        run: |
          tar -xf MeloNX_archive.xcarchive.tar

      - name: Install ldid
        run: |
          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            -o /usr/local/bin/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_$(uname -m)"

          chmod +x /usr/local/bin/ldid

      - name: Verify MeloNX app
        run: |
          test -d \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app"

          echo "MeloNX.app found."

      - name: Fake sign frameworks
        run: |
          find \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            -type d \
            -path '*/Frameworks/*.framework' \
            -exec ldid -SMeloNX-hv.entitlements {} \;

      - name: Fake sign dylibs
        run: |
          find \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            -type f \
            -name '*.dylib' \
            -exec ldid -SMeloNX-hv.entitlements {} \;

      - name: Fake sign MeloNX
        run: |
          ldid \
            -SMeloNX-hv.entitlements \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app/MeloNX"

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
            "MeloNX_archive.xcarchive/Products/Applications/MeloNX.app" \
            Payload/MeloNX.app

          zip \
            -r \
            MeloNX.ipa \
            Payload \
            -x "._*" \
            -x ".DS_Store" \
            -x "__MACOSX/*"

      - name: Verify IPA
        run: |
          ls -lh MeloNX.ipa

          unzip -l MeloNX.ipa | head -50

      - name: Upload MeloNX IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX_latest.ipa
          path: MeloNX.ipa
